<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 · 수능 성적·후기 조사</title>
<link rel="stylesheet" href="assets/style.css?v=20261125b">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/admin.css?v=20261127c">
</head>
<body class="adm">
<div id="login" class="login" hidden>
  <div class="login-box">
    <div class="brand">MARATHON KOREAN</div>
    <h1>수능 조사 관리자</h1>
    <input class="inp" id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" id="pwbtn">들어가기</button>
    <p class="err" id="pwerr"></p>
  </div>
</div>
<div id="main" hidden>
  <header class="ah">
    <div class="ah-in">
      <b class="ah-title">수능 성적·후기 조사</b>
      <nav class="tabs" id="tabs">
        <button data-tab="approve" class="on">승인</button>
        <button data-tab="stats">통계</button>
        <button data-tab="reviews">후기</button>
        <button data-tab="messages">종현샘께 한마디</button>
        <button data-tab="gifts">기프티콘</button>
        <button data-tab="roster">명단</button>
        <button data-tab="cuts">등급컷</button>
        <button data-tab="settings">설정</button>
      </nav>
      <button class="mini" id="reload" title="새로 불러오기">↻ 새로고침</button>
    </div>
  </header>
  <main class="am" id="view"></main>
</div>
<aside id="detail" class="detail" hidden></aside>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-box" id="modalbox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="assets/config.js?v=20261125b"></script>
<script src="assets/admin.js?v=20261127d"></script>
</body>
</html>
